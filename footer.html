<script>
(() => {
  const year = document.getElementById('copyright-year');
  if (year) year.textContent = new Date().getFullYear();
})();
</script>
<script>
(() => {
  document.querySelectorAll('.csl-entry').forEach(entry => {
    const year = entry.textContent.match(/\b(19\d{2}|20\d{2})\b/);
    if (!year) return;
    const content = document.createElement('div'); content.className = 'citation-body';
    while (entry.firstChild) content.append(entry.firstChild);
    const label = document.createElement('span'); label.className = 'citation-year'; label.textContent = year[0];
    entry.classList.add('year-entry'); entry.append(label, content);
  });
  const media = matchMedia('(prefers-color-scheme: dark)');
  let preference = 'system';
  try { preference = localStorage.getItem('ma-site-theme') || 'system'; } catch (_) {}
  const button = document.createElement('button'); button.id = 'theme-toggle'; button.type = 'button';
  const icon = document.createElement('i'); icon.setAttribute('aria-hidden', 'true'); button.append(icon);
  const navbar = document.querySelector('.navbar-container');
  if (navbar) navbar.append(button);
  function apply() {
    const dark = preference === 'system' ? media.matches : preference === 'dark';
    document.documentElement.classList.toggle('site-dark', dark); document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    icon.className = dark ? 'bi bi-sun' : 'bi bi-moon';
    button.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    button.title = button.getAttribute('aria-label');
  }
  button.addEventListener('click', () => {
    preference = document.documentElement.classList.contains('site-dark') ? 'light' : 'dark';
    try { localStorage.setItem('ma-site-theme', preference); } catch (_) {}
    apply();
  });
  media.addEventListener('change', apply); apply();
})();
</script>
