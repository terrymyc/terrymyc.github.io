  site-url: https://yongchaoma.com
  description: "Yongchao Ma, Ph.D. — social science methodologist and statistician working on survey design, participation, and AI-assisted data collection."
  search: false
  navbar:
    background: light
    left:
      - href: index.qmd
        text: Home
      - about.qmd
      - research.qmd
      - teaching.qmd
      - software.qmd
      - text: CV
        href: files/Ma_CV.pdf
  google-analytics: G-J3JH393N54
  page-footer:
    left: "© <span id='copyright-year'>2026</span> Yongchao Ma"
    right:
      - text: Email
        href: mailto:ytma@umich.edu
      - text: Google Scholar
        href: https://scholar.google.com/citations?user=1pKheqkAAAAJ&hl=en
      - text: ORCID
        href: https://orcid.org/0000-0003-4100-5468
      - text: LinkedIn
        href: https://www.linkedin.com/in/yongchao-ma
      - text: GitHub
        href: https://github.com/terrymyc

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: false
    anchor-sections: true
